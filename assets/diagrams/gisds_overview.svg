<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title description">
<title id="title">GISDS — source catalogue and dataset use</title>
<desc id="description">GISDS contains 25 catalogue resources with IDs RS001–RS025, not 25 completed dataset records. Selected existing examples include satellite imagery, land-cover products, water resources, airborne and terrain products, computation and map presentation. These examples are not a new taxonomy. Dataset use requires separate product, date, resolution, CRS, processing and licence metadata and interpretation limits.</desc>
